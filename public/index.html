<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171C3A">
<meta name="description" content="The Film Studio: a colourful, step-by-step Year 6 filmmaking pack.">
<title>The Film Studio | Year 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --ink-2:#24365E; --paper:#EEF1F5; --card:#FFFFFF; --line:#D3D9E2; --muted:#55607A;
  --amber:#F2A93B; --amber-soft:#FDF0D8; --teal:#17777A; --teal-soft:#DFF1F0; --red:#C8323F; --green:#2E7D4F;
  --s-cuh:#F2A93B; --s-cuf:#17777A; --s-ws:#14213D; --s-ms:#2F6690; --s-ots:#5B3FAF; --s-dutch:#B5283F;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:96px}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0}

/* top bar */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.01em;color:#fff;text-decoration:none;line-height:1}
.tbtn{border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:5px 14px;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.tbtn:hover{border-color:var(--amber)}

/* clapperboard sticks: the one bold device */
.sticks{height:16px;background:repeating-linear-gradient(135deg,#fff 0 18px,var(--ink) 18px 36px)}
.clap{background:var(--ink);color:#fff}
.clap-in{padding:14px 16px 20px}
.clap .back{font-size:15px;color:#fff;opacity:.85}
.filmno{font-family:var(--display);font-weight:800;color:var(--amber);font-size:22px;margin-top:10px;letter-spacing:.02em}
.clap .title{font-family:var(--display);font-weight:800;font-size:clamp(38px,8vw,58px);line-height:.95;letter-spacing:.005em}
.rolechip{display:inline-flex;gap:10px;align-items:center;margin-top:14px;padding:6px 14px;border-radius:999px;border:2px solid var(--amber);color:#fff;text-decoration:none;font-weight:600;font-size:15px}
.rolechip span{color:var(--amber);text-decoration:underline}

/* home */
.hero{padding:26px 0 6px}
.h1,.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,64px);line-height:.95}
.lede{font-size:18px;color:var(--muted);margin:10px 0 0;max-width:36em}
.steps{list-style:none;display:flex;gap:8px;padding:0;margin:18px 0 0;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600}
.steps li span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;font-size:18px}
.films{display:grid;gap:12px;grid-template-columns:1fr;margin:22px 0 18px}
@media (min-width:720px){.films{grid-template-columns:1fr 1fr}}
.film{display:grid;grid-template-columns:62px 1fr;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 12px;text-decoration:none;color:var(--ink)}
.film:hover{border-color:var(--ink)}
.film .n{font-family:var(--display);font-weight:800;font-size:58px;line-height:.85;text-align:center}
.film h3{font-family:var(--display);font-weight:800;font-size:27px;line-height:1}
.film p{margin:6px 0 0;font-size:16px;line-height:1.4}
.film .where{display:block;font-size:14px;color:var(--muted);margin-top:8px}
.flag{display:inline-block;margin-left:8px;background:var(--amber-soft);color:var(--ink);border-radius:6px;padding:0 6px;font-weight:600}
.small{font-size:14px;color:var(--muted);margin:8px 0 24px}

/* role picker */
.roles{margin:18px 0 30px}
.role{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.role strong{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.role span{display:block;color:var(--muted);margin-top:4px}
.role[aria-pressed="true"]{border-color:var(--amber);border-left-width:10px}
.role:hover{border-color:var(--ink)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:7px 14px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:600;text-decoration:none;color:var(--ink);font-size:15px;white-space:nowrap;line-height:1.2}
.tab small{font-weight:500;font-size:11.5px;color:var(--muted)}
.tab[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab[aria-current="page"] small{color:var(--amber)}

/* part view */
.part-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
.part-head h2,.sec h2{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.tag{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px}
.tag.must{background:var(--ink);color:#fff}
.tag.addon{background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber)}
.beats{list-style:none;padding:0;margin:10px 0 14px;display:grid;gap:8px;max-width:42em}
.beats li{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:baseline;font-size:18px;line-height:1.45}
.beats .bn{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted)}
.note-soft{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:10px 14px;margin:10px 0}
.cut{display:flex;gap:14px;align-items:flex-start;background:var(--amber-soft);border-left:8px solid var(--amber);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;margin:14px 0}
.cut svg{flex:0 0 auto;margin-top:2px}
.cut-label{font-family:var(--display);font-weight:800;font-size:20px;line-height:1}
.cut-text{font-size:21px;font-weight:700;line-height:1.3;margin-top:4px}
.cut-help{font-size:15px;color:var(--muted);margin-top:4px}
.blk{margin:18px 0}
.blk h3{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;margin-bottom:8px}
.say{margin:0 0 10px;padding-left:14px;border-left:4px solid var(--ink)}
.say .who{display:block;font-size:14px;font-weight:700;color:var(--muted)}
.say .words{display:block;font-size:21px;font-weight:600;line-height:1.35}
.faces{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.faces li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.faces b{display:block;font-size:14px;color:var(--muted)}
.hint{font-size:14.5px;color:var(--muted);margin:0 0 6px}
.timing{display:grid;grid-template-columns:1fr 1fr 1fr;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin:8px 0 4px;max-width:560px}
.seg{padding:7px 6px;text-align:center;font-size:14px;line-height:1.2}
.seg b{display:block;font-family:var(--display);font-size:22px;line-height:1}
.seg.trim{background:#E4E8EF}
.seg.act{background:var(--amber);border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.calls-row{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.calls-row span:nth-child(2){text-align:center;transform:translateX(-30%)}
.calls-row span:nth-child(3){text-align:center;transform:translateX(30%)}
.calls-row span:last-child{text-align:right}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--amber);border-width:3px;background:#FFFBF3}
.opt-static{cursor:default}
.opt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.letter{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.ours{background:var(--amber);color:var(--ink);font-weight:700;font-size:13px;padding:2px 8px;border-radius:6px}
.shotrow{display:grid;grid-template-columns:136px 1fr;gap:12px;align-items:start;margin:8px 0}
.shotrow .meta{display:block}
.shotrow .lbl{display:block;font-family:var(--display);font-weight:800;font-size:19px;line-height:1;margin-bottom:5px}
.shotrow .st{font-size:16px}
.thumb{display:block}
.thumb svg{display:block;width:100%;height:auto;border-radius:8px;border:2px solid var(--ink);background:#F4F6F9}
.cap{display:block;font-size:12.5px;line-height:1.35;color:var(--ink-2);margin-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:0}
.whokey{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.whokey span{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 6px;font-size:14.5px;font-weight:600}
.whokey .dot{width:14px;height:14px;margin:0}
.cutrow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:2px 0 2px 2px}
.cutrow.on{color:var(--ink);font-weight:700}
.cutrow .dash{display:inline-block;width:15px;border-top:2px dotted #AEB7C6}
.chip{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.02em;padding:1px 7px;border-radius:6px;color:#fff;margin-right:5px;line-height:1.5;vertical-align:1px;white-space:nowrap}
.s-cuh{background:var(--s-cuh);color:var(--ink)}
.s-cuf{background:var(--s-cuf)}
.s-ws{background:var(--s-ws)}
.s-ms{background:var(--s-ms)}
.s-ots{background:var(--s-ots)}
.s-dutch{background:var(--s-dutch)}
.chip.off{background:transparent;color:var(--muted);border:1.5px dashed #AEB7C6;padding:0 6px}
.line180{display:block;text-decoration:none;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:10px 14px;margin:14px 0}
.line180 b{font-family:var(--display);font-weight:800;font-size:21px;margin-right:6px}
.line180 span{display:block;font-size:14.5px;color:var(--muted)}
.pnote{background:var(--teal-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.check{border-top:2px solid var(--line);margin-top:22px;padding-top:14px}
.check ul{margin:0;padding:0;list-style:none}
.check li{position:relative;padding-left:28px;margin:7px 0}
.check li::before{content:"";position:absolute;left:0;top:4px;width:16px;height:16px;border:2px solid var(--ink);border-radius:4px}
.pager{display:flex;justify-content:space-between;gap:10px;margin:28px 0 10px}
.pager a{flex:1;text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px 14px;font-weight:600}
.pager a small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.pager .nx{text-align:right}

/* story */
.plot{font-size:20px;line-height:1.5;margin:14px 0;max-width:38em}
.facts{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:720px){.facts{grid-template-columns:1fr 1fr}}
.cast{list-style:none;padding:0;margin:0}
.cast li{display:flex;gap:10px;align-items:baseline;margin:6px 0}
.size{flex:0 0 auto;min-width:56px;text-align:center;font-weight:700;font-size:13px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px}
.tick{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.tick input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ink);flex:0 0 auto}
.idioms{display:flex;flex-wrap:wrap;gap:6px;padding:0;list-style:none;margin:0}
.idioms li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15.5px}

/* plan */
.switch{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:14px 0;font-weight:600}
.switch input{width:24px;height:24px;accent-color:var(--ink);flex:0 0 auto}
.planlist{list-style:none;padding:0;margin:0}
.planlist li{padding:12px 0;border-bottom:1px solid var(--line)}
.planlist li.off{opacity:.6}
.pname{display:block;font-family:var(--display);font-weight:800;font-size:23px;line-height:1;margin-bottom:8px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mini b{font-family:var(--display);font-size:24px;line-height:1}
.mini .chip{margin:0;font-size:11px;padding:0 5px}
.mini[aria-pressed="true"]{border-color:var(--amber);border-width:3px;background:#FFFBF3}
.summary{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:16px 0}
.summary p{margin:8px 0 0;font-weight:600}
.summary .sub{font-weight:400;color:var(--muted);font-size:15px;margin-top:4px}
.summary.done{border-color:var(--green)}
.codebox{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:.06em;background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 16px;display:inline-block;margin:6px 0 10px}
.loadform label{display:block;font-weight:600;margin-top:6px}
.loadform .row{display:flex;gap:8px;margin-top:6px}
.loadform input{flex:1;min-width:0;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;text-transform:uppercase;font-size:20px;letter-spacing:.08em}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.msg{min-height:1.5em;margin:6px 0 0;font-weight:600}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:15}
.barin{display:flex;align-items:center;gap:10px;justify-content:space-between}
.shots{display:flex;flex-direction:column;gap:3px;text-decoration:none;min-width:0}
.shots .lab{font-size:12.5px;font-weight:700;color:var(--muted)}
.shots .row{display:flex;flex-wrap:wrap;gap:4px}
.shots .chip{font-size:11px;margin:0;padding:0 5px}
.bbtn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:700;white-space:nowrap}

/* rules */
.backlink{display:inline-block;margin-top:16px;font-weight:600}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
.jump a{text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px}
.sec{padding-top:22px;scroll-margin-top:70px}
.sec p,.sec li{max-width:40em}
.sec h3{margin-top:14px}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:var(--r);overflow:hidden;margin:10px 0;font-size:16px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--ink);color:#fff;font-weight:600;font-size:14.5px}
.frame{display:grid;gap:10px;margin:10px 0}
.fr{display:grid;grid-template-columns:54px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fr .big{font-family:var(--display);font-weight:800;font-size:54px;line-height:.85;color:var(--ink)}
.fr h3{font-size:18px;font-family:var(--body);font-weight:700;margin:0}
.fr p{margin:4px 0 0}
.fr .fix{color:var(--muted);font-size:15px}
.ruleslist li{margin:6px 0}
.diagram{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin:12px 0}
.diagram svg{display:block;width:100%;height:auto}

/* call sheet */
.calls{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:50;display:flex;flex-direction:column;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.calls[hidden]{display:none}
.calls-top{display:flex;justify-content:space-between;align-items:center}
.calls .num{font-family:var(--display);font-weight:800;color:var(--amber);font-size:26px}
.cclose{background:transparent;border:2px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:6px 16px;font-weight:600}
.calls-main{flex:1;display:flex;flex-direction:column;justify-content:center;cursor:pointer;max-width:900px;width:100%;margin:0 auto}
.calls .who{font-size:20px;font-weight:600;color:var(--amber)}
.calls .call{font-family:var(--display);font-weight:800;font-size:clamp(56px,14vw,140px);line-height:.92;margin:8px 0 16px}
.calls .whatc{font-size:21px;max-width:30em;opacity:.92}
.ctimer{margin-top:22px;max-width:560px}
.ctimer .clabel{font-weight:700;color:var(--amber);font-size:18px}
.ctimer .ccount{font-family:var(--display);font-weight:800;font-size:64px;line-height:1}
.cbar{height:14px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:6px}
.cbar span{display:block;height:100%;width:0;background:var(--amber)}
.calls-nav{display:flex;gap:10px;max-width:900px;width:100%;margin:0 auto}
.calls-nav button{flex:1;border-radius:14px;padding:16px;font-weight:700;font-size:19px;border:2px solid rgba(255,255,255,.45);background:transparent;color:#fff}
.calls-nav .primary{background:var(--amber);border-color:var(--amber);color:var(--ink)}
body.locked{overflow:hidden}

/* script */
.spart{margin:24px 0 8px;padding-top:14px;border-top:3px solid var(--ink)}
.spart h3{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.sopt{font-size:14.5px;color:var(--muted);margin:4px 0 6px}
.sshot{display:grid;grid-template-columns:170px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0}
@media (max-width:520px){.sshot{grid-template-columns:128px 1fr;gap:10px}}
.sshot .tc{font-family:var(--display);font-weight:800;font-size:21px;line-height:1;margin-bottom:6px}
.sshot .tc small{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);margin-left:6px}
.sshot p{margin:6px 0}
.sline{padding:6px 10px;border-left:4px solid var(--ink);background:#F7F8FB;border-radius:0 8px 8px 0}
.sline .who{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sline .words{display:block;font-weight:600;font-size:17px}
.inshot{font-size:14px;color:var(--muted)}
.hl{background:var(--amber-soft)!important;outline:3px solid var(--amber)}
.hlpick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;font-weight:600}
.hlpick select{font:inherit;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:#fff}
.endnote{font-weight:700;margin:20px 0 4px}
.thumbcell{width:130px}

/* a complete performance script, plus a guided read-through */
.script-summary{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,#171C3A,#343D78);color:#fff;border-radius:17px;padding:20px;margin:0 0 22px}
.script-summary h3{font-family:var(--display);font-size:30px;line-height:1}.script-summary p{margin:7px 0 0;color:#E8EAF5;max-width:36em}
.script-stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.script-stats span{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}
.run-script{display:inline-flex;align-items:center;justify-content:center;min-height:52px;background:#FFCB3D;color:#171C3A;border:0;border-radius:13px;padding:11px 18px;font-weight:900;white-space:nowrap;box-shadow:0 5px 0 #D99F00}.run-script::before{content:"▶";margin-right:8px;font-size:13px}.run-script:hover{filter:brightness(.96);transform:translateY(-1px)}
.script-help{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 22px}.script-help div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13.5px;color:var(--muted)}.script-help b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}

v button{min-height:52px;border-radius:13px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-weight:900;font-size:17px}.runner-nav .runner-next{background:#FFCB3D;border-color:#FFCB3D;color:#171C3A}.runner-nav button:disabled{opacity:.36;cursor:not-allowed}
/* step-by-step team reflection and improvement plan */
.improve-banner{--stage:#217A45!important;--stage-soft:#E1F5E7!important}
.review-lead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:#171C3A;color:#fff;border-radius:16px;padding:17px 19px;margin:0 0 15px}.review-lead h3{font-family:var(--display);font-size:28px;line-height:1}.review-lead p{margin:5px 0 0;color:#E6E8F2;max-width:37em;font-size:14px}.review-count{display:grid;place-items:center;width:68px;height:68px;border-radius:18px;background:#FFCB3D;color:#171C3A;font-family:var(--display);font-size:31px;font-weight:900;line-height:.8;text-align:center}.review-count small{display:block;font-family:var(--body);font-size:9px;text-transform:uppercase;letter-spacing:.07em;margin-top:5px}

.review-card{--review:#7146C7;--review-soft:#EFE7FF;overflow:hidden;background:#fff;border:2px solid var(--review);border-radius:19px;box-shadow:0 7px 0 color-mix(in srgb,var(--review) 15%,transparent)}.review-group-1{--review:#7146C7;--review-soft:#EFE7FF}.review-group-2{--review:#C94D12;--review-soft:#FFF0D7}.review-group-3{--review:#2859D6;--review-soft:#E6EDFF}.review-group-4{--review:#087F83;--review-soft:#DDF7F3}.review-group-5{--review:#217A45;--review-soft:#E1F5E7}.review-progress{height:9px;background:#E6E4ED}.review-progress span{display:block;height:100%;background:var(--review);border-radius:0 999px 999px 0}.review-card-head{position:relative;padding:20px 20px 17px;background:var(--review-soft)}.review-kicker{display:block;color:var(--review);font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;margin-bottom:7px}.review-card h3{font-family:var(--display);font-size:clamp(34px,5vw,48px);line-height:.98;max-width:16em}.review-qno{position:absolute;right:18px;top:10px;font-family:var(--display);font-size:70px;font-weight:900;color:var(--review);opacity:.1}.review-card-body{padding:19px 20px}.review-look{display:flex;gap:10px;align-items:flex-start;border-left:6px solid var(--review);background:#F5F4F9;border-radius:0 11px 11px 0;padding:12px 14px;margin:0 0 17px}.review-look b{color:var(--review);white-space:nowrap}
.review-answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 0 16px}.review-answer{min-height:52px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:900}.review-answer.good[aria-pressed="true"]{background:#E1F5E7;border-color:#217A45;color:#145D32}.review-answer.work[aria-pressed="true"]{background:#FFF0D7;border-color:#C94D12;color:#923408}.review-answer::before{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;margin-right:7px}.review-answer.good::before{content:"✓";background:#E1F5E7;color:#217A45}.review-answer.work::before{content:"!";background:#FFF0D7;color:#C94D12}.review-answer.good[aria-pressed="true"]::before,.review-answer.work[aria-pressed="true"]::before{background:currentColor;color:#fff}.review-note-label{display:block;font-size:13px;font-weight:900;color:var(--ink);margin-bottom:6px}.review-note{display:block;width:100%;min-height:88px;resize:vertical;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font:inherit}.review-note:focus{border-color:var(--review)}.review-nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.review-nav button{min-height:50px;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;font-weight:900}.review-nav .review-next{background:var(--ink);color:#fff}.review-nav button:disabled{opacity:.35;cursor:not-allowed}
.review-summary{background:#fff;border:2px solid #8FC7A0;border-radius:19px;overflow:hidden}.review-summary-head{background:#E1F5E7;padding:21px}.review-summary-head h3{font-family:var(--display);font-size:40px;line-height:1}.review-summary-head p{margin:8px 0 0}.review-score{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.review-score span{background:#fff;border:1px solid #8FC7A0;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:850}.review-plan{padding:18px 20px}.review-plan h4{font-family:var(--display);font-size:26px;margin:0 0 10px}.improvement-list{display:grid;gap:10px;list-style:none;padding:0;margin:0}.improvement-list li{border-left:7px solid #C94D12;background:#FFF7E8;border-radius:0 12px 12px 0;padding:12px 14px}.improvement-list b{display:block;margin-bottom:4px}.improvement-list p{margin:5px 0 0;color:var(--muted);font-size:14px}.review-empty{background:#F5F4F9;border:2px dashed var(--line);border-radius:12px;padding:16px}.summary-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.summary-actions button{min-height:46px;border:2px solid var(--ink);background:#fff;border-radius:11px;padding:8px 14px;font-weight:900}.summary-actions .print-review{background:var(--ink);color:#fff}
@media print{
  .top,.bar,.tabs,.pager,.rolechip,.clap .back,.hlpick,.sticks,.script-summary,.script-help,.script-runner,.review-lead,.review-steps,.review-card,.summary-actions{display:none!important}
  body{background:#fff;padding:0}
  .clap{background:#fff;color:var(--ink)}
  .sshot{break-inside:avoid}
  .screen-scene{break-inside:avoid;box-shadow:none}.camera-plan>summary{display:none}.camera-plan:not([open])>*:not(summary){display:block!important}
  .review-summary{border:0}.review-plan{padding:0}.improvement-list li{break-inside:avoid}
}

@media (prefers-reduced-motion:no-preference){
  .opt,.mini,.role,.film{transition:border-color .15s}
}

/* ---------- 2026 Film Studio redesign ---------- */
:root{
  --ink:#171C3A; --ink-2:#30375E; --paper:#F5F3FB; --card:#FFFFFF; --line:#DAD7E7; --muted:#565B74;
  --amber:#FFCB3D; --amber-soft:#FFF3C7; --teal:#087F83; --teal-soft:#DDF7F3; --red:#C73246; --green:#217A45;
  --blue:#2859D6; --blue-soft:#E6EDFF; --coral:#D94736; --coral-soft:#FFE8E3; --purple:#7146C7; --purple-soft:#EFE7FF;
  --stage-1:#2859D6; --stage-1-soft:#E6EDFF; --stage-2:#087F83; --stage-2-soft:#DDF7F3;
  --stage-3:#C94D12; --stage-3-soft:#FFF0D7; --stage-4:#7146C7; --stage-4-soft:#EFE7FF;
  --stage-5:#217A45; --stage-5-soft:#E1F5E7; --r:18px;
}
html{scroll-behavior:smooth}
body{background:var(--paper);font-size:17px;line-height:1.55;padding-bottom:104px}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 8% 12%,rgba(255,203,61,.16),transparent 22rem),radial-gradient(circle at 96% 35%,rgba(113,70,199,.1),transparent 28rem)}
.wrap{max-width:1060px;padding-left:20px;padding-right:20px}
:focus-visible{outline:4px solid #FFCB3D;outline-offset:3px}
.top{background:#171C3A;box-shadow:0 4px 18px rgba(23,28,58,.16)}
.top .wrap{height:68px}
.brand{display:flex;align-items:center;gap:10px;font-size:25px}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--amber);color:var(--ink);font-family:var(--display);font-size:22px;transform:rotate(-3deg);box-shadow:inset 0 -4px 0 rgba(23,28,58,.12)}
.brand-copy{display:flex;flex-direction:column;line-height:.85}
.brand-copy small{font-family:var(--body);font-size:10px;line-height:1.1;letter-spacing:.16em;text-transform:uppercase;color:#C9CCE0;margin-top:4px}
.tbtn{border-color:rgba(255,255,255,.7);padding:7px 15px;background:rgba(255,255,255,.06)}
.tbtn:hover{background:#fff;color:var(--ink);border-color:#fff}
.sticks{height:14px;background:repeating-linear-gradient(135deg,#fff 0 16px,#fff 16px,#FFCB3D 16px,#FFCB3D 32px,#171C3A 32px,#171C3A 48px)}

/* Home: a studio welcome, not a document index */
.home-mast{position:relative;overflow:hidden;background:#171C3A;color:#fff;padding:clamp(38px,8vw,74px) 0 80px}
.home-mast::before,.home-mast::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.home-mast::before{width:340px;height:340px;right:-90px;top:-170px;background:#7146C7;opacity:.72}
.home-mast::after{width:170px;height:170px;right:18%;bottom:-105px;background:#087F83;opacity:.9}
.home-hero{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end}
.studio-eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;color:#FFDA69;font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.studio-eyebrow::before{content:"";width:34px;border-top:4px solid currentColor}
.home-title{font-family:var(--display);font-weight:800;font-size:clamp(58px,12vw,104px);line-height:.82;letter-spacing:-.015em;max-width:7em}
.home-title .action{color:#FFCB3D}
.home-lede{font-size:clamp(18px,2.4vw,23px);line-height:1.4;max-width:35em;margin:22px 0 0;color:#E6E8F2}
.take-badge{position:relative;display:grid;place-items:center;width:142px;aspect-ratio:1;border:3px solid #fff;border-radius:50%;font-family:var(--display);font-weight:800;text-align:center;transform:rotate(5deg);background:#D94736;box-shadow:14px 14px 0 #2859D6}
.take-badge b{font-size:54px;line-height:.7}.take-badge span{font-size:17px;letter-spacing:.09em;text-transform:uppercase}
.home-content{position:relative;margin-top:-48px;z-index:2}
.onboarding{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 42px;counter-reset:studio-step}
.onboard{position:relative;min-height:148px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:22px 20px 18px;box-shadow:0 10px 28px rgba(23,28,58,.09);counter-increment:studio-step}
.onboard::before{content:counter(studio-step);display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--step);color:#fff;font-family:var(--display);font-size:28px;font-weight:800;margin-bottom:14px}
.onboard:nth-child(1){--step:#2859D6}.onboard:nth-child(2){--step:#7146C7}.onboard:nth-child(3){--step:#217A45}
.onboard h2{font-family:var(--display);font-size:26px;line-height:1}.onboard p{margin:7px 0 0;color:var(--muted);font-size:15px;line-height:1.4}
.library-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:0 0 18px}
.library-head h2{font-family:var(--display);font-size:clamp(38px,6vw,52px);line-height:.95}
.library-head p{max-width:31em;margin:0;color:var(--muted)}
.films{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 0 24px}
.film-card{--film:#2859D6;--film-soft:#E6EDFF;position:relative;overflow:hidden;background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 7px 0 rgba(23,28,58,.07);min-width:0}
.film-card::before{content:"";display:block;height:9px;background:var(--film)}
.film-card.film-1{--film:#9A5B00;--film-soft:#FFF1B8}.film-card.film-2{--film:#1F56C5;--film-soft:#E3EDFF}
.film-card.film-3{--film:#C53D31;--film-soft:#FFE5DF}.film-card.film-4{--film:#6D3FC1;--film-soft:#EEE5FF}
.film-card.film-5{--film:#007772;--film-soft:#DDF7F2}.film-card.film-6{--film:#30345E;--film-soft:#E9E9F4}
.film-card.film-7{--film:#A33D68;--film-soft:#FBE3EC}.film-card.film-8{--film:#2C6E3C;--film-soft:#E2F4E3}
.film-card.film-9{--film:#A94314;--film-soft:#FFE8D8}.film-card.film-10{--film:#39647A;--film-soft:#E0F1F4}
.film-card-main{padding:18px 20px 15px;background:linear-gradient(135deg,var(--film-soft),#fff 60%)}
.film-id{display:flex;gap:14px;align-items:flex-start}
.film-number{display:grid;place-items:center;flex:0 0 58px;height:58px;border-radius:16px;background:var(--film);color:#fff;font-family:var(--display);font-size:39px;font-weight:800;line-height:1;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.film-meta{min-width:0}.film-kicker{display:block;color:var(--film);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 5px}
.film-card h3{font-family:var(--display);font-size:clamp(27px,3.4vw,34px);line-height:.94;color:var(--ink)}
.film-card .hook{font-size:15.5px;line-height:1.4;margin:13px 0;color:var(--ink-2)}
.film-card .where{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13.5px;margin:0}
.film-card .where::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--film);flex:0 0 auto}
.flag{display:inline-flex;margin:9px 0 0;background:#fff;color:var(--ink);border:1px solid var(--film);padding:3px 8px;border-radius:999px;font-size:12px}
.card-actions{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.card-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:11px;padding:9px 14px;text-decoration:none;font-weight:800;font-size:14px}
.card-actions .choose{background:var(--film);color:#fff;flex:1}.card-actions .role-link{border:2px solid var(--film);color:var(--film);background:#fff}
.card-actions a:hover{filter:brightness(.94);transform:translateY(-1px)}
.card-journey{border-top:1px solid var(--line);padding:12px 14px 14px;background:#fff}
.card-journey-label{display:block;margin:0 4px 7px;font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.card-stages{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.card-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px;border-radius:9px;text-decoration:none;font-size:10.5px;font-weight:800;line-height:1.1;color:var(--ink);background:var(--stage-soft);border:1px solid rgba(23,28,58,.1)}
.card-stage b{font-family:var(--display);font-size:17px;line-height:1;color:var(--stage)}
.stage-beginning{--stage:var(--stage-1);--stage-soft:var(--stage-1-soft)}
.stage-middle{--stage:var(--stage-2);--stage-soft:var(--stage-2-soft)}
.stage-dilemma{--stage:var(--stage-3);--stage-soft:var(--stage-3-soft)}
.stage-resolution{--stage:var(--stage-4);--stage-soft:var(--stage-4-soft)}
.stage-end{--stage:var(--stage-5);--stage-soft:var(--stage-5-soft)}
.privacy-note{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin:22px 0 34px;color:var(--muted);font-size:13.5px}

.clap.film-1{--film:#F2B626}.clap.film-2{--film:#4F8BFF}.clap.film-3{--film:#F06050}.clap.film-4{--film:#956ADE}.clap.film-5{--film:#16AAA2}.clap.film-6{--film:#858CBD}.clap.film-7{--film:#DA6C98}.clap.film-8{--film:#5EA66B}.clap.film-9{--film:#F08B53}.clap.film-10{--film:#69A3B9}

}
@media (max-width:760px){
  .wrap{padding-left:15px;padding-right:15px}.home-mast{padding-bottom:70px}.home-hero{grid-template-columns:1fr}.take-badge{display:none}

  .beats{grid-template-columns:1fr}.beats li{min-height:0}.faces{grid-template-columns:1fr}.view-panel{padding:14px}.section-banner{padding:19px 17px}

}
@media (max-width:480px){

  .film-tools{gap:4px}.film-tool{font-size:12px}.journey-label span:last-child{display:none}.role{padding-left:72px}.shotrow{grid-template-columns:116px 1fr}.barin{align-items:flex-end}.shots .chip{font-size:9px}
  .print-btn{width:100%;margin:8px 0 0}.part-head{align-items:stretch}.calls{padding-left:12px;padding-right:12px}
  .script-runner{padding-left:10px;padding-right:10px}.runner-head,.runner-content{padding-left:15px;padding-right:15px}.runner-nav button{font-size:15px}.scene-body{padding:14px}.scene-head{padding:14px}.scene-no{width:42px;height:42px}
}
@media print{
  .top,.bar,.film-nav-shell,.location-strip,.pager,.rolechip,.clap .back,.print-btn,.home-mast,.onboarding,.card-actions,.card-journey,.script-runner,.review-lead,.review-steps,.review-card,.summary-actions{display:none!important}
  .view-panel{border:0;box-shadow:none;padding:0}.section-banner{break-inside:avoid}.blk,.beats li{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

function parseOpt(str) {
  const shots = str.split('|').map(s => s.trim());

    <div class="calls-row" aria-hidden="true"><span>Camera rolling</span><span>Action!</span><span>Cut!</span><span>End scene!</span></div>`;
}

/* ---------- shot frames: where each actor is on the screen ---------- */
const CHAR_COL = ['#0F7B6C', '#E07A1F', '#8E44AD', '#C0392B', '#2C82C9', '#6D8B2E'];
const GROUP_COL = '#8A94A8';
const FONT = 'IBM Plex Sans, Arial, sans-serif';
const isObj = n => /^[a-z]/.test(n);
const isGroup = n => n === 'Class' || n === 'Group';
function colourOf(f, n) { if (isGroup(n)) return GROUP_COL; const i = f.chars.indexOf(n); return CHAR_COL[Math.max(0, i) % CHAR_COL.length]; }
const initialOf = (f, n) => (f.ini && f.ini[n]) || n.charAt(0);
function parseWho(w) {
  if (w.includes('>')) { const [fg, subj] = w.split('>'); return {type: 'ots', fg, subj}; }
  if (w.includes(':')) { const [owner, obj] = w.split(':'); return {type: 'hands', owner: owner || null, obj}; }
  return {type: 'list', items: w.split(',')};
}
function personsIn(who) {
  const W = parseWho(who);
  const ns = W.type === 'list' ? W.items : W.type === 'ots' ? [W.fg, W.subj] : [W.owner];
  return ns.filter(n => n && !isObj(n));
}
/* left third = 64, right third = 128, middle = 96 */
function place(items, lr) {
  if (items.length === 1) {
    const n = items[0], i = lr.indexOf(n);
    return [{name: n, x: isGroup(n) ? 96 : i === 0 ? 64 : i === 1 ? 128 : 96}];
  }
  const out = [], taken = [];
  const wide = items.length >= 3, L = wide ? 44 : 64, R = wide ? 148 : 128;
  items.forEach(n => { const i = lr.indexOf(n); if (i === 0 || i === 1) { const x = i === 0 ? L : R; out.push({name: n, x}); taken.push(x); } });
  items.forEach(n => {
    if (out.some(o => o.name === n)) return;
    const x = [L, R, 96, 20, 172].find(s => !taken.includes(s));
    out.push({name: n, x}); taken.push(x);
  });
  return out.sort((a, b) => a.x - b.x);
}
const facing = (it, arr) => arr.length === 1 ? (it.x <= 96 ? 1 : -1) : (arr.some(o => o.x > it.x) ? 1 : -1);
function otsSide(fg, subj, lr) {
  const fs = lr.indexOf(fg);
  if (fs === 0 || fs === 1) return fs;
  return lr.indexOf(subj) === 0 ? 1 : 0;
}
function fig(x, ty, s, col, face, ini, mode) {
  const letter = !ini ? '' : mode === 'head'
    ? `<text x="0" y="14.8" font-size="${ini.length > 1 ? 6 : 7}" font-weight="700" text-anchor="middle" fill="#fff" font-family="${FONT}">${esc(ini)}</text>`
    : `<text x="0" y="46" font-size="${ini.length > 1 ? 12 : 15}" font-weight="700" text-anchor="middle" fill="#fff" font-family="${FONT}">${esc(ini)}</text>`;
  return `<g transform="translate(${x} ${ty}) scale(${s})"><rect x="-10" y="56" width="8" height="44" rx="3" fill="${col}"/><rect x="2" y="56" width="8" height="44" rx="3" fill="${col}"/><rect x="-13" y="20" width="26" height="42" rx="8" fill="${col}"/><circle cx="0" cy="10" r="9" fill="${col}" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${face * 4.5}" cy="8" r="1.6" fill="#fff"/>${letter}</g>`;
}
const objW = (label, minW, fs) => Math.max(minW, label.length * fs * 0.68 + 14);
function objBox(x, cy, label, minW, h, fs) {
  const w = objW(label, minW, fs);
  return `<rect x="${x - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="5" fill="#DCE1EA" stroke="#14213D" stroke-width="1.5"/><text x="${x}" y="${cy + fs / 3}" font-size="${fs}" font-weight="600" text-anchor="middle" fill="#14213D" font-family="${FONT}">${esc(label)}</text>`;
}
function listComp(f, p, items, size) {
  const arr = place(items, p.lr || []);
  const persons = arr.filter(a => !isObj(a.name)).length;
  const draw = it => {
    const n = it.name, x = it.x;
    if (isObj(n)) return size === 'ws' ? objBox(x, 86, n, 30, 16, 8) : size === 'ms' ? objBox(x, 74, n, 50, 28, 10) : objBox(x, 58, n, 80, 44, 12);
    const col = colourOf(f, n), face = facing(it, arr);
    if (isGroup(n)) return size === 'ws'
      ? [-16, 0, 16].map(d => fig(x + d, 54, 0.42, col, face, '', '')).join('')
      : [-26, 0, 26].map(d => fig(x + d, 30, 1, col, face, '', '')).join('');
    if (size === 'ws') return fig(x, 48, 0.48, col, face, initialOf(f, n), 'body');
    if (size === 'ms') { const s = persons > 2 ? 1.1 : 1.45; return fig(x, 38 - 10 * s, s, col, face, initialOf(f, n), 'body'); }
    const s = persons > 1 ? 2.4 : 3.4;
    return fig(x, 46 - 10 * s, s, col, face, initialOf(f, n), 'head');
  };
  return arr.filter(a => isObj(a.name)).map(draw).join('') + arr.filter(a => !isObj(a.name)).map(draw).join('');
}
function handsComp(f, owner, obj) {
  if (!owner) return objBox(96, 56, obj, 96, 52, 14);
  const col = colourOf(f, owner);
  const w = objW(obj, 76, 12);
  const lx = Math.max(10, 96 - w / 2 - 4), rx = Math.min(182, 96 + w / 2 + 4);
  return objBox(96, 58, obj, 76, 40, 12) +
    `<rect x="-6" y="58" width="${lx + 6}" height="22" rx="10" fill="${col}"/><circle cx="${lx}" cy="66" r="12" fill="${col}" stroke="#fff" stroke-width="1.5"/>` +
    `<rect x="${rx}" y="58" width="${198 - rx}" height="22" rx="10" fill="${col}"/><circle cx="${rx}" cy="66" r="12" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
}
function otsComp(f, fg, subj, lr) {
  const fs = otsSide(fg, subj, lr);
  const fx = fs === 0 ? 28 : 164, sx = fs === 0 ? 128 : 64, face = fs === 0 ? -1 : 1;
  let back;
  if (isObj(subj)) back = objBox(sx, 62, subj, 56, 32, 10);
  else if (isGroup(subj)) back = [-22, 0, 22].map(d => fig(sx + d, 32, 1.05, GROUP_COL, face, '', '')).join('');
  else back = fig(sx, 24.5, 1.35, colourOf(f, subj), face, initialOf(f, subj), 'body');
  let front;
  if (isObj(fg)) front = objBox(fx, 76, fg, 70, 56, 12);
  else {
    const col = isGroup(fg) ? GROUP_COL : colourOf(f, fg);
    const shapes = c => `<rect x="${fx - 48}" y="82" width="96" height="40" rx="18" fill="${c}"/><circle cx="${fx}" cy="60" r="30" fill="${c}"/>`;
    front = `<g>${shapes(col)}<g opacity="0.25">${shapes('#14213D')}</g></g>`;
  }
  return back + front;
}
function frameSVG(f, p, s) {
  const W = parseWho(s.who), lr = p.lr || [];
  const core = size => W.type === 'hands' ? handsComp(f, W.owner, W.obj)
    : W.type === 'ots' ? otsComp(f, W.fg, W.subj, lr) : listComp(f, p, W.items, size);
  let body;
  if (s.shot === 'WS') body = `<rect x="0" y="94" width="192" height="14" fill="#E3E8EF"/>${core('ws')}`;
  else if (s.shot === 'MS' || s.shot === 'OTS') body = core('ms');
  else if (s.shot === 'CUF' || s.shot === 'CUH') body = core('cu');
  else body = `<g transform="rotate(-14 96 54)"><path d="M-60 98H252" stroke="#C5CCD8" stroke-width="3"/>${core('ms')}</g>`;
  const grid = `<path d="M64 0V108M128 0V108M0 36H192M0 72H192" stroke="#C9D0DB" stroke-width="1" stroke-dasharray="3 3" fill="none"/>`;
  return `<svg viewBox="0 0 192 108" role="img" aria-label="${esc(caption(f, p, s, false))}">${grid}${body}</svg>`;
}
function caption(f, p, s, html) {
  const W = parseWho(s.who), lr = p.lr || [];
  const nm = n => isObj(n) ? 'the ' + (html ? esc(n) : n) : (html ? `<span class="dot" style="background:${colourOf(f, n)}"></span>${esc(n)}` : n);
  const side = x => x < 96 ? 'on the left' : x > 96 ? 'on the right' : 'in the middle';
  let t;
  if (W.type === 'hands') t = W.owner ? `${nm(W.owner)}'s hands with the ${html ? esc(W.obj) : W.obj}` : `close on the ${html ? esc(W.obj) : W.obj}`;
  else if (W.type === 'ots') {
    const fs = otsSide(W.fg, W.subj, lr);
    t = `${nm(W.fg)} ${isObj(W.fg) ? 'in front' : 'with their back to us'} ${fs === 0 ? 'on the left' : 'on the right'}, ${nm(W.subj)} ${fs === 0 ? 'on the right' : 'on the left'}`;
  } else t = place(W.items, lr).map(it => `${nm(it.name)} ${side(it.x)}`).join(', ');
  if (s.shot === 'DUTCH') t += ', camera tilted';
  return t.charAt(0) === '<' ? t : cap(t);
}
function whoKey(f, names) {
  return `<div class="whokey">${names.map(n => `<span><span class="dot" style="background:${colourOf(f, n)}"></span>${esc(n)}</span>`).join('')}</div>`;
}
function partPeople(f, p) {
  const set = new Set();
  p.opts.forEach(o => o.forEach(s => personsIn(s.who).forEach(n => set.add(n))));
  return f.chars.filter(c => set.has(c));
}

function renderRole(f, next) {
  document.title = 'Pick your role · ' + f.title + ' | The Film Studio';
  setBar('');
  const cur = getRole();

function shotRows(f, p, o) {
  const at = p.at;
  return o.map((s, k) => {
    let h = `<span class="shotrow"><span class="thumb">${frameSVG(f, p, s)}<span class="cap">${caption(f, p, s, true)}</span></span><span class="meta"><span class="lbl">Shot ${k + 1}</span>${chip(s.shot)}<span class="st">${esc(s.text)}</span></span></span>`;
    if (k < 2) h += (k + 1 === at)
      ? `<span class="cutrow on">${SCISSORS(15, '#14213D')}Cut on movement</span>`
      : `<span class="cutrow"><span class="dash"></span>Cut</span>`;
    return h;
  }).join('');
}

function optsView(f, i, pick) {
  const p = f.parts[i];
  return `<div class="blk"><h3>Camera options</h3><p class="hint">The director picks one. Tap it again to clear it. Add extra shots if you need them.</p>
    ${p.opts.map((o, k) => { const L = 'ABC'[k], on = pick === L; return `<button class="opt" data-act="pick" data-film="${f.n}" data-part="${i}" data-letter="${L}" aria-pressed="${on}"><span class="opt-head"><span class="letter">Option ${L}</span>${on ? '<span class="ours">Our choice</span>' : ''}</span>${shotRows(f, p, o)}</button>`; }).join('')}
  </div>`;
}

function chosenView(f, i, pick) {
  if (!pick) return `<div class="blk"><h3>Our shots</h3><p class="note-soft">No shots picked on this device yet. Ask your director for the team code and load it in <a href="#/film/${f.n}/plan">Plan</a>.</p></div>`;
  const o = f.parts[i].opts['ABC'.indexOf(pick)];
  return `<div class="blk"><h3>Our shots</h3><div class="opt opt-static"><span class="opt-head"><span class="letter">Option ${pick}</span><span class="ours">Our choice</span></span>${shotRows(f, f.parts[i], o)}</div></div>`;
}

function checklist(role) {
  const r = ROLES.find(x => x.id === role);
  return `<div class="check"><h3>${esc(r.name)} checklist</h3><ul>${CHECK[role].map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`;
}

function partView(f, i, role, plan) {
  const p = f.parts[i], meta = PARTS[i];
  const show = k => VIS[k].includes(role);
  let h = `<section class="partv stage-${meta.key}"><div class="section-banner stage-${meta.key}" data-number="${i + 1}"><span class="section-kicker">Film ${f.n} · Part ${i + 1} of 5</span><h2>${meta.name}</h2><p>${STAGE_BRIEFS[meta.key]}</p><span class="tag ${meta.must ? 'must' : 'addon'}">${meta.must ? 'Core stage · must film' : 'Add-on stage · optional'}</span></div>`;
  if (!meta.must && !plan.addons) h += `<p class="note-soft">Your team isn't filming the add-ons. Switch them on in <a href="#/film/${f.n}/plan">Plan</a> if you change your mind.</p>`;
  h += `<ol class="beats">${p.beats.map((b, k) => `<li><span class="bn">Shot ${k + 1}</span><span>${esc(b)}</span></li>`).join('')}</ol>`;
  h += `<p class="hint">Who's who in the shot pictures:</p>${whoKey(f, partPeople(f, p))}`;
  h += `<div class="cut">${SCISSORS(30, '#14213D')}<div><div class="cut-label">Cut on movement</div><div class="cut-text">${esc(cap(p.cut))}</div><div class="cut-help">Between shot ${p.at} and shot ${p.at + 1}. The movement happens in full in both shots, so the editor can cut in the middle of it.</div></div></div>`;
  if (show('line')) h += `<div class="blk"><h3>Key line</h3>${speakers(p.line).map(s => `<p class="say"><span class="who">${esc(s.who)}</span><span class="words">${esc(s.say)}</span></p>`).join('')}</div>`;

      <div class="codebox" aria-label="Team code">${planCode(f, plan)}</div>
      <form class="loadform" data-form="load"><label for="codein">Load a team code</label>
        <div class="row"><input id="codein" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. ${f.n}-AB00C"><button class="btn" type="submit">Load</button></div>
        <p class="msg" role="status"></p></form>
    </div>
  </section>`;
}

function scriptView(f, plan) {
  const hl = store.get('hl:' + f.n, '');
  const tc = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  let t = 0;
  const allWords = PARTS.flatMap((_, i) => fullLines(f, i)).reduce((n, x) => n + x.say.split(/\s+/).length, 0);
  const coreWords = PARTS.flatMap((meta, i) => meta.must ? fullLines(f, i) : []).reduce((n, x) => n + x.say.split(/\s+/).length, 0);
  const estimate = words => Math.max(30, Math.round((words / 2.4 + 24) / 5) * 5);
  const duration = sec => sec < 60 ? `${sec} sec` : `${Math.floor(sec / 60)} min ${sec % 60 ? sec % 60 + ' sec' : ''}`.trim();
  let h = `<section class="script">
    <div class="section-banner utility" data-number="S"><span class="section-kicker">Film ${f.n} · Performance & production</span><div class="part-head"><h2>Full script</h2><button class="print-btn" type="button" data-act="print">Print script</button></div><p>A complete scene-by-scene screenplay for rehearsing, performing and filming your story.</p></div>
    <div class="script-summary"><div><h3>Ready for a read-through?</h3><p>Run all five scenes in order. The guided view keeps the current scene, action and lines large and obvious for the whole crew.</p><div class="script-stats"><span>5 scenes</span><span>${allWords} spoken words</span><span>Full story · about ${duration(estimate(allWords))}</span><span>Core cut · about ${duration(estimate(coreWords))}</span></div></div><button class="run-script" type="button" data-act="script-run" data-film="${f.n}">Run the script</button></div>
    <div class="script-help"><div><b>1 · Rehearse the scene</b>Read the action and every line before filming.</div><div><b>2 · Perform the full dialogue</b>Hold speaking shots for 5–8 seconds when needed.</div><div><b>3 · Open the camera plan</b>Use your team's three chosen shots for each scene.</div></div>
    <label class="hlpick">Highlight a character <select data-act="hl" data-film="${f.n}"><option value="">Nobody</option>${f.chars.map(c => `<option${c === hl ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></label>`;
  PARTS.forEach((meta, i) => {
    const p = f.parts[i], picked = plan.picks[i], L = picked || 'A', o = p.opts['ABC'.indexOf(L)];
    const lines = fullLines(f, i);
    const people = f.chars.filter(c => o.some(s => personsIn(s.who).includes(c)));
    const included = meta.must || plan.addons;
    h += `<article class="screen-scene stage-${meta.key}${included ? '' : ' not-in-cut'}"><header class="scene-head"><span class="scene-no">${i + 1}</span><div><h3>${meta.name}</h3><span class="slugline">INT. ${esc(f.where)} · ${meta.must ? 'Core scene' : 'Optional add-on'}</span>${included ? '' : '<span class="optional-scene">Not in your current cut · still available to rehearse</span>'}</div><span class="scene-time">${i + 1} / 5<small>Scene</small></span></header><div class="scene-body">
      <div class="script-direction"><b>What happens</b><ol>${p.beats.map(b => `<li>${esc(b)}</li>`).join('')}</ol></div>
      <div class="dialogue-list" aria-label="Scene ${i + 1} dialogue">${lines.map(x => `<div class="dialogue${hl && x.who.includes(hl) ? ' hl' : ''}"><span class="speaker">${esc(x.who)}</span><span class="speech">${esc(x.say)}</span></div>`).join('')}</div>
      <div class="performance-note"><b>Play it like this</b><span>${esc(p.faces)}</span></div>
      <p class="scene-cut"><b>Continuity moment:</b> repeat ${esc(p.cut)} in both shots around the cut.</p>
      <details class="camera-plan"><summary><span>Camera plan · ${picked ? `Team option ${L}` : `Option A preview`}</span><span>3 shots</span></summary>
      ${people.length ? `<p class="inshot">Actors in these frames:</p>${whoKey(f, people)}` : ''}`;
    o.forEach((s, k) => {
      const say = lines.filter((x, j) => Math.min(2, Math.floor(j * 3 / lines.length)) === k);
      const inShot = personsIn(s.who);
      const mark = hl && (inShot.includes(hl) || say.some(x => x.who.includes(hl)));
      const shotWords = say.reduce((n, x) => n + x.say.split(/\s+/).length, 0);
      const shotSeconds = Math.max(3, Math.ceil(shotWords / 2.4) + (say.length ? 2 : 0));
      h += `<div class="sshot${mark ? ' hl' : ''}">
        <div class="thumb">${frameSVG(f, p, s)}<span class="cap">${caption(f, p, s, true)}</span></div>
        <div>
          <div class="tc">${tc(t)}<small>Shot ${k + 1} · about ${shotSeconds}s</small></div>
          <div>${chip(s.shot)}<span class="st">${esc(s.text)}</span></div>
          <p><b>Action:</b> ${esc(p.beats[k])}</p>
          ${say.map(x => `<p class="sline${hl && x.who.includes(hl) ? ' hl' : ''}"><span class="who">${esc(x.who)}</span><span class="words">${esc(x.say)}</span></p>`).join('')}
          <p class="inshot">In shot: ${inShot.length ? inShot.map(esc).join(', ') : 'nobody, close on an object'}</p>
        </div></div>`;
      t += shotSeconds;
      if (k < 2) h += k + 1 === p.at
        ? `<div class="cutrow on">${SCISSORS(15, '#14213D')}Cut on movement: ${esc(p.cut)}</div>`
        : `<div class="cutrow"><span class="dash"></span>Cut</div>`;
    });
    h += `</details></div></article>`;
  });
  h += `<p class="endnote">Full performance script: about ${duration(t)} using the team's selected camera plans.</p></section>`;
  return h;
}

function improveView(f, plan) {
  const qs = reviewQuestions(f, plan), review = getReview(f);
  const pos = Math.min(getReviewPos(f), qs.length);
  const current = qs[pos];
  const answered = qs.filter(q => review.answers[q.id]).length;
  const steps = REVIEW_GROUPS.map((g, i) => {
    const groupQs = qs.filter(q => q.group === i), complete = groupQs.length && groupQs.every(q => review.answers[q.id]);
    const cls = current && current.group === i ? ' current' : complete ? ' done' : '';
    return `<div class="review-step${cls}"><b>${i + 1}</b><span>${g.short}</span></div>`;
  }).join('');
  let body;
  if (current) {
    const answer = review.answers[current.id] || '', note = review.notes[current.id] || '';
    body = `<article class="review-card review-group-${current.group + 1}">
      <div class="review-progress" aria-hidden="true"><span style="width:${Math.round((pos + 1) / qs.length * 100)}%"></span></div>
      <header class="review-card-head"><span class="review-kicker">Step ${current.group + 1} · ${REVIEW_GROUPS[current.group].name}</span><h3>${esc(current.q)}</h3><span class="review-qno">${pos + 1}</span></header>
      <div class="review-card-body"><p class="review-look"><b>What to check</b><span>${esc(current.look)}</span></p>
        <div class="review-answers" role="group" aria-label="Team decision"><button class="review-answer good" type="button" data-act="review-answer" data-value="good" data-film="${f.n}" data-id="${current.id}" aria-pressed="${answer === 'good'}">Looks good</button><button class="review-answer work" type="button" data-act="review-answer" data-value="work" data-film="${f.n}" data-id="${current.id}" aria-pressed="${answer === 'work'}">Needs work</button></div>
        <label class="review-note-label" for="review-note">Our evidence or next change</label><textarea class="review-note" id="review-note" data-act="review-note" data-film="${f.n}" data-id="${current.id}" maxlength="500" placeholder="For example: reshoot the close-up so we can see the reaction clearly.">${esc(note)}</textarea>
      </div></article>
      <nav class="review-nav" aria-label="Review questions"><button type="button" data-act="review-prev" data-film="${f.n}"${pos === 0 ? ' disabled' : ''}>← Previous question</button><button class="review-next" type="button" data-act="review-next" data-film="${f.n}">${pos === qs.length - 1 ? 'Build improvement plan →' : 'Next question →'}</button></nav>`;
  } else {
    const work = qs.filter(q => review.answers[q.id] === 'work'), good = qs.filter(q => review.answers[q.id] === 'good'), open = qs.length - work.length - good.length;
    body = `<section class="review-summary"><header class="review-summary-head"><span class="review-kicker" style="color:#217A45">Review complete</span><h3>Team improvement plan</h3><p>Fix the items below one at a time. Watch the new version after each change so you can see whether it helped.</p><div class="review-score"><span>✓ ${good.length} looking good</span><span>! ${work.length} to improve</span>${open ? `<span>${open} not answered</span>` : ''}</div></header>
      <div class="review-plan"><h4>Our next changes</h4>${work.length ? `<ol class="improvement-list">${work.map((q, i) => `<li><b>${i + 1}. ${esc(q.q)}</b><span>${esc(q.look)}</span>${review.notes[q.id] ? `<p><b>Team note:</b> ${esc(review.notes[q.id])}</p>` : ''}</li>`).join('')}</ol>` : `<p class="review-empty">Nothing is marked “Needs work” yet. Go through the questions again or show the film to another team and ask what they notice.</p>`}
      <div class="summary-actions"><button type="button" data-act="review-again" data-film="${f.n}">← Review questions again</button><button class="print-review" type="button" data-act="print">Print improvement plan</button></div></div></section>`;
  }
  return `<section class="improvev"><div class="section-banner utility improve-banner" data-number="+"><span class="section-kicker">Film ${f.n} · Team extension</span><h2>Review & improve</h2><p>Watch your film, answer one focused question at a time and turn the team's decisions into a practical improvement plan.</p></div>
    <div class="review-lead"><div><h3>One question. One decision. One useful change.</h3><p>Use “Looks good” when everyone can point to evidence in the film. Use “Needs work” when a reshoot or edit would make the story clearer.</p></div><div class="review-count">${answered}<small>of ${qs.length}<br>answered</small></div></div>
    <div class="review-steps" aria-label="Five review steps">${steps}</div>${body}</section>`;
}

function sequence(f) {
  const plan = getPlan(f);
  return ['story', 'script'].concat(PARTS.filter(p => p.must || plan.addons).map(p => p.key)).concat(['plan', 'improve']);
}
function pager(f, tab) {
  let seq = sequence(f);
  if (!seq.includes(tab)) seq = ['story', 'script'].concat(PARTS.map(p => p.key)).concat(['plan', 'improve']);
  const i = seq.indexOf(tab);
  const prev = seq[i - 1], next = seq[i + 1];
  return `<nav class="pager" aria-label="Previous and next">${prev ? `<a href="#/film/${f.n}/${prev}"><small>Back</small>${esc(tabLabel(prev))}</a>` : '<span></span>'}${next ? `<a class="nx" href="#/film/${f.n}/${next}"><small>Next</small>${esc(tabLabel(next))}</a>` : '<span></span>'}</nav>`;
}

function barView(f, plan, role) {
  const set = covered(f, plan);
  const have = REQUIRED.filter(s => set.has(s)).length;
  return `<div class="wrap barin"><a class="shots" href="#/film/${f.n}/plan" aria-label="Five-shot check: ${have} of 5 planned. Open the team plan.">
      <span class="lab">Five-shot check: ${have} of 5</span><span class="row">${REQUIRED.map(s => chip(s, !set.has(s))).join('')}</span></a>
      ${role === 'director' ? `<button class="bbtn" data-act="calls">Call sheet</button>` : ''}</div>`;
}

function renderFilm(f, tab) {
  const role = getRole();
  const plan = getPlan(f);
  store.set('lastFilm', f.n);
  const keys = ['story', 'script'].concat(PARTS.map(p => p.key)).concat(['plan', 'improve']);
  if (!keys.includes(tab)) tab = 'story';
  document.title = tabLabel(tab) + ' · ' + f.title + ' | The Film Studio';
  let body;
  if (tab === 'story') body = storyView(f, role);
  else if (tab === 'script') body = scriptView(f, plan);
  else if (tab === 'plan') body = planView(f, plan);
  else if (tab === 'improve') body = improveView(f, plan);
  else body = partView(f, PARTS.findIndex(p => p.key === tab), role, plan);
  const roleName = (ROLES.find(r => r.id === role) || {}).name || 'Crew member';
  const utility = ['story','script','plan','improve'];
  const stageIndex = PARTS.findIndex(p => p.key === tab);
  $app.innerHTML = `${clap(f, true)}<div class="wrap">
    <div class="location-strip" aria-label="Current location"><a href="#/">Film library</a><span class="sep">›</span><span>Film ${f.n}</span><span class="sep">›</span><span>${esc(roleName)}</span><span class="sep">›</span><span class="here">${esc(tabLabel(tab))}</span></div>
    <div class="film-nav-shell"><nav class="film-tools" aria-label="Story and production tools">${utility.map(k => `<a class="film-tool" href="#/film/${f.n}/${k}"${k === tab ? ' aria-current="page"' : ''}>${k === 'story' ? 'Story overview' : k === 'script' ? 'Script & shots' : k === 'plan' ? 'Team plan' : 'Review & improve'}</a>`).join('')}</nav>
      <div class="journey-label"><span>Make your film · 5 stages</span><span>Colour shows where you are</span></div>
      <nav class="stage-track" aria-label="Five film stages">${PARTS.map((p,i) => `<a class="stage-tab stage-${p.key}" href="#/film/${f.n}/${p.key}"${p.key === tab ? ' aria-current="page"' : ''}><span class="stage-no">${i+1}</span><span class="stage-name">${p.name}<small>${p.must ? 'Core stage' : 'Add-on'}</small></span></a>`).join('')}</nav>
    </div>
    <div class="view-panel${stageIndex > -1 ? ` stage-${tab}` : ''}">${body}</div>${pager(f, tab)}</div>`;
  setBar(barView(f, plan, role));
  const nav = $app.querySelector('.stage-track'), act = $app.querySelector('.stage-tab[aria-current]');
  if (nav && act) nav.scrollLeft = act.offsetLeft - nav.clientWidth / 2 + act.clientWidth / 2;
}

const DEMO = {n: 0, chars: ['A', 'B'], ini: {A: 'A', B: 'B'}};
const DEMO_PART = {lr: ['A', 'B']};

function renderRules(section) {
  document.title = 'Set rules | The Film Studio';
  setBar('');
  const last = film(store.get('lastFilm', 0));
  const jumps = [['calls', 'The seven calls'], ['frame', 'FRAME check'], ['shots', 'Five shots'], ['cut', 'Cut on movement'], ['r180', '180° rule'], ['director', 'Directors'], ['actors', 'Actors']];
  $app.innerHTML = `${stickBand()}<div class="wrap">
    <a class="backlink" href="${last ? '#/film/' + last.n : '#/'}">${last ? 'Back to ' + esc(last.title) : 'All films'}</a>
    <section class="hero" style="padding-top:12px"><h1 class="h1">Set rules</h1><p class="lede">Every team follows these on every take. If a shot breaks a rule, film it again.</p></section>
    <nav class="jump" aria-label="Rules sections">${jumps.map(j => `<a href="#/rules/${j[0]}">${j[1]}</a>`).join('')}</nav>

    <section class="sec" id="calls"><h2>The seven calls</h2>
      <p>Every take uses the same seven calls in the same order. From call 1 to call 7, only the director and camera operator speak.</p>
      <table><thead><tr><th>#</th><th>Call</th><th>Who</th><th>What happens</th></tr></thead><tbody>
      ${PROTOCOL.map((c, i) => `<tr><td>${i + 1}</td><td><b>${c.call === 'Hand signal' ? 'Silent hand signal' : '&ldquo;' + esc(c.call) + '&rdquo;'}</b></td><td>${esc(c.who)}</td><td>${esc(c.what)}</td></tr>`).join('')}
      </tbody></table>
      <h3>Every shot: 3, 3, 3</h3>
      <p>Each shot has 3 seconds of trim, about 3 seconds of action, then 3 more seconds of trim. That is about 9 seconds of recording per shot. The editor cuts the trims away and joins the shots with a cut on movement.</p>
      ${timingStrip()}
      <p><b>Three shots minimum:</b> every scene has at least three shots.</p>
      <p><b>Two-person teams:</b> when both of you are in the shot, set the camera on its stand. The camera operator presses the shutter, says "Rolling camera", then walks to their mark. The director still makes every call.</p>
    </section>

    <section class="sec" id="frame"><h2>The FRAME check</h2>
      <p>Before every "Quiet on set", the director and camera operator check the camera screen. One "no" means fix it before you roll.</p>
      <div class="frame">${FRAME.map(r => `<div class="fr"><span class="big">${r[0]}</span><div><h3>${esc(r[1])}</h3><p>${esc(r[2])}</p><p class="fix">If not: ${esc(r[3])}</p></div></div>`).join('')}</div>
      <p>After every take, watch the playback and check FRAME again. At the end of each part, take one reference photo of the set and actors.</p>
    </section>

    <section class="sec" id="shots"><h2>The five-shot sequence</h2>
      <p>Every film uses all five of these at least once.</p>
      <table><thead><tr><th>Shot</th><th>Looks like</th><th>Tells the audience</th><th>Frame it like this</th></tr></thead><tbody>
      ${SHOT_ROWS.map(r => `<tr><td>${chip(r[0])}<br><small>${esc(SHOT_LONG[r[0]])}</small></td><td class="thumbcell"><span class="thumb">${frameSVG(DEMO, DEMO_PART, {shot: r[0], who: DEMO_WHO[r[0]]})}</span></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}
      <tr><td>${chip('MS')}<br><small>Also use</small></td><td class="thumbcell"><span class="thumb">${frameSVG(DEMO, DEMO_PART, {shot: 'MS', who: DEMO_WHO.MS})}</span></td><td>What someone is doing and how they move</td><td>Mid shot, from the waist up. Use it as often as you like.</td></tr>
      </tbody></table>
      <p>In the shot pictures, each colour is one actor. Actor A stays on the left and Actor B stays on the right, which keeps the 180° line.</p>
    </section>

    <section class="sec" id="cut"><h2>Cut on movement</h2>
      <p>Every scene has at least three shots, joined by a cut on movement. The edit jumps to a new angle in the middle of an action, so the audience follows the movement and never notices the cut.</p>
      <h3>Filming it</h3>
      <ol class="ruleslist">
        <li>Find the movement. Each part of your film names one, and which two shots it joins.</li>
        <li>In the first shot, film the whole movement, from just before it starts to just after it ends.</li>
        <li>Change the angle a lot. Move the camera and change the shot size (WS to CU face, OTS to CU hands).</li>
        <li>Stay on the same side of the 180° line.</li>
        <li>In the next shot, the actor repeats the whole movement exactly. Same hand, same speed, same direction, same words.</li>
        <li>Check FRAME, especially E: props start in the same place in both shots.</li>
      </ol>
      <h3>Cutting it</h3>
      <ol class="ruleslist">
        <li>Trim the 3 seconds from the start and end of every shot.</li>
        <li>Put the shots in order on the timeline.</li>
        <li>In the first shot, find the moment the movement is about halfway. Split there and delete the rest.</li>
        <li>In the next shot, find the same point in the movement. Split there and delete everything before it.</li>
        <li>Play it back. If the movement jumps or repeats, move the cut a few frames and try again.</li>
      </ol>
      <table><thead><tr><th>Job</th><th>iMovie (MacBook)</th><th>ClipChamp (Windows)</th></tr></thead><tbody>
        <tr><td>Split a clip</td><td>Move the playhead, then Modify &gt; Split Clip (Command + B)</td><td>Move the playhead, then click the scissors or press S</td></tr>
        <tr><td>Remove a piece</td><td>Click it and press Delete</td><td>Click it and press Delete</td></tr>
        <tr><td>Check the cut</td><td>Press Space to play</td><td>Press Space to play</td></tr>
      </tbody></table>
    </section>

    <section class="sec" id="r180"><h2>The 180° rule</h2>
      <p>When two characters face each other, the camera stays on one side of the line between them. Whoever starts on the left of the screen stays on the left.</p>
      <div class="diagram">${DIAGRAM}</div>
      <ol class="ruleslist">
        <li>Find the line: imagine it running through both actors, nose to nose.</li>
        <li>Mark it: lay a strip of tape or a ruler on the floor along the line. Put a tape X on the camera's side.</li>
        <li>Every shot in that part comes from the X side: WS, MS, OTS, CU face, CU hands and Dutch.</li>
        <li>OTS pair: film over A's shoulder onto B, then over B's shoulder onto A. Both from the X side.</li>
        <li>Check the playback: if A was on the left in the first shot, A is on the left in every shot. If anyone swaps sides, reshoot.</li>
        <li>Walking shots: keep the movement going the same way across the screen every time.</li>
      </ol>
      <p>You may only cross the line if the audience sees it happen in one shot: the camera moves across while rolling, or an actor walks across in frame.</p>
    </section>

    <section class="sec" id="director"><h2>Director shortcuts</h2>
      <ol class="ruleslist">${DIRECTOR_RULES.map(r => `<li><b>${esc(r[0])}</b> ${esc(r[1])}</li>`).join('')}</ol>
    </section>

    <section class="sec" id="actors"><h2>Actor shortcuts</h2>
      <ol class="ruleslist">${ACTOR_RULES.map(r => `<li><b>${esc(r[0])}</b> ${esc(r[1])}</li>`).join('')}</ol>
    </section>
  </div>`;
  if (section) {
    const el = document.getElementById(section);
    if (el && el.scrollIntoView) el.scrollIntoView();
  }
}

function setBar(html) {
  $bar.innerHTML = html;
  $bar.hidden = !html;
  document.body.style.paddingBottom = html ? '' : '32px';
}

/* ---------- call sheet with 3-second timers ---------- */
let callIdx = 0, timerId = null;
function clearTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function drawCalls() {
  clearTimer();
  const c = PROTOCOL[callIdx];
  $calls.innerHTML = `<div class="calls-top"><span class="num">Call ${callIdx + 1} of 7</span><button class="cclose" data-act="calls-close">Close</button></div>
    <div class="calls-main" data-act="call-next"><div class="who">${esc(c.cue)}</div><div class="call">${esc(c.call)}</div><div class="whatc">${esc(c.what)}</div>
      ${c.timer ? `<div class="ctimer"><span class="clabel">${esc(c.tlabel)}</span><div class="ccount">${c.timer}</div><div class="cbar"><span></span></div></div>` : ''}</div>
    <div class="calls-nav"><button data-act="call-prev">Back</button><button class="primary" data-act="call-next">${callIdx === 6 ? 'Next take' : 'Next call'}</button></div>`;
  if (c.timer) {
    const t0 = Date.now(), sec = c.timer;
    timerId = setInterval(() => {
      const el = (Date.now() - t0) / 1000;
      const bar = $calls.querySelector('.cbar span'), cnt = $calls.querySelector('.ccount');
      if (bar) bar.style.width = Math.min(100, el / sec * 100) + '%';
      if (cnt) cnt.textContent = Math.max(0, Math.ceil(sec - el));
      if (el >= sec) { clearTimer(); stepCalls(1); }
    }, 100);
  }
}
function openCalls() { callIdx = 0; drawCalls(); $calls.hidden = false; document.body.classList.add('locked'); const b = $calls.querySelector('.primary'); if (b) b.focus(); }
function closeCalls() { clearTimer(); $calls.hidden = true; document.body.classList.remove('locked'); }
function stepCalls(d) { callIdx = (callIdx + d + 7) % 7; drawCalls(); const b = $calls.querySelector('.primary'); if (b) b.focus(); }

/* ---------- guided script read-through ---------- */
let scriptRunFilm = null, scriptRunIdx = 0;
function drawScriptRunner() {
  if (!scriptRunFilm) return;
  const f = scriptRunFilm, i = scriptRunIdx, meta = PARTS[i], p = f.parts[i], lines = fullLines(f, i);
  const plan = getPlan(f), picked = plan.picks[i], L = picked || 'A';
  $runner.className = `script-runner stage-${meta.key}`;
  $runner.innerHTML = `<div class="runner-top"><div class="runner-brand">${esc(f.title)}<small>Guided read-through</small></div><button class="runner-close" type="button" data-act="script-close">Close</button></div>
    <div class="runner-progress" role="progressbar" aria-label="Read-through progress" aria-valuemin="1" aria-valuemax="5" aria-valuenow="${i + 1}"><span style="width:${(i + 1) * 20}%"></span></div>
    <div class="runner-main"><section class="runner-card"><header class="runner-head"><span class="runner-count">Scene ${i + 1} of 5 · ${meta.must ? 'Core scene' : 'Optional add-on'}</span><h2>${meta.name}</h2><p>${STAGE_BRIEFS[meta.key]}</p></header><div class="runner-content">
      <div class="script-direction"><b>Action · three story beats</b><ol>${p.beats.map(b => `<li>${esc(b)}</li>`).join('')}</ol></div>
      <h3>Read the lines</h3><div class="dialogue-list">${lines.map(x => `<div class="dialogue"><span class="speaker">${esc(x.who)}</span><span class="speech">${esc(x.say)}</span></div>`).join('')}</div>
      <div class="performance-note"><b>Performance</b><span>${esc(p.faces)}</span></div>
      <p class="runner-note"><b>Camera cue:</b> Team option ${L} · ${f.parts[i].opts['ABC'.indexOf(L)].map(s => SHOT_NAMES[s.shot]).join(' → ')}. Repeat <b>${esc(p.cut)}</b> for the cut on movement.</p>
    </div></section></div>
    <div class="runner-nav"><button type="button" data-act="script-prev"${i === 0 ? ' disabled' : ''}>← Previous scene</button><button class="runner-next" type="button" data-act="script-next">${i === 4 ? 'Finish read-through' : `Next: ${PARTS[i + 1].name} →`}</button></div>`;
}
function openScriptRunner(f) {
  scriptRunFilm = f; scriptRunIdx = 0; drawScriptRunner(); $runner.hidden = false; document.body.classList.add('locked');
  const b = $runner.querySelector('.runner-next'); if (b) b.focus();
}
function closeScriptRunner() { $runner.hidden = true; $runner.className = 'script-runner'; scriptRunFilm = null; document.body.classList.remove('locked'); }
function stepScriptRunner(d) {
  if (d > 0 && scriptRunIdx === 4) return closeScriptRunner();
  scriptRunIdx = Math.max(0, Math.min(4, scriptRunIdx + d)); drawScriptRunner();
  const main = $runner.querySelector('.runner-main'); if (main) main.scrollTop = 0;
  const b = $runner.querySelector('.runner-next'); if (b) b.focus();
}

/* ---------- router and events ---------- */
function route() {
  const seg = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (seg[0] === 'film') {
    const f = film(+seg[1]);
    if (!f) return renderHome();
    if (seg[2] === 'role') return renderRole(f, seg[3] || 'story');
    if (!getRole()) return renderRole(f, seg[2] || 'story');
    return renderFilm(f, seg[2] || 'story');
  }
  if (seg[0] === 'rules') return renderRules(seg[1]);
  renderHome();
}
function rerender() { const y = window.scrollY; route(); try { window.scrollTo(0, y); } catch (e) {} }

window.addEventListener('hashchange', () => {
  closeCalls();
  closeScriptRunner();
  route();
  if (!/^#\/rules\/./.test(location.hash)) { try { window.scrollTo(0, 0); } catch (e) {} }
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'role') {
    setRole(t.dataset.role);
    const target = '#/film/' + t.dataset.film + '/' + (t.dataset.next || 'story');
    if (location.hash === target) route(); else location.hash = target;
  } else if (act === 'pick') {
    const f = film(+t.dataset.film), plan = getPlan(f), i = +t.dataset.part, L = t.dataset.letter;
    plan.picks[i] = plan.picks[i] === L ? null : L;
    savePlan(f, plan);
    rerender();
  } else if (act === 'print') window.print();
  else if (act === 'review-answer') {
    const f = film(+t.dataset.film), review = getReview(f);
    review.answers[t.dataset.id] = t.dataset.value;
    saveReview(f, review); rerender();
  }
  else if (act === 'review-next' || act === 'review-prev') {
    const f = film(+t.dataset.film), qs = reviewQuestions(f, getPlan(f));
    const next = Math.max(0, Math.min(qs.length, getReviewPos(f) + (act === 'review-next' ? 1 : -1)));
    saveReviewPos(f, next); rerender();
  }
  else if (act === 'review-again') {
    const f = film(+t.dataset.film); saveReviewPos(f, 0); rerender();
  }
  else if (act === 'script-run') openScriptRunner(film(+t.dataset.film));
  else if (act === 'script-close') closeScriptRunner();
  else if (act === 'script-next') stepScriptRunner(1);
  else if (act === 'script-prev') stepScriptRunner(-1);
  else if (act === 'calls') openCalls();
  else if (act === 'calls-close') closeCalls();
  else if (act === 'call-next') stepCalls(1);
  else if (act === 'call-prev') stepCalls(-1);
});

document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset) return;
  if (t.dataset.act === 'prop') {
    const n = +t.dataset.film, k = +t.dataset.k;
    const ticks = store.get('ticks:' + n, []).filter(x => x !== k);
    if (t.checked) ticks.push(k);
    store.set('ticks:' + n, ticks);
  } else if (t.dataset.act === 'hl') {
    store.set('hl:' + t.dataset.film, t.value);
    rerender();
  } else if (t.dataset.act === 'addons') {
    const f = film(+t.dataset.film), plan = getPlan(f);
    plan.addons = t.checked;
    savePlan(f, plan);
    rerender();
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset || t.dataset.act !== 'review-note') return;
  const f = film(+t.dataset.film), review = getReview(f);
  review.notes[t.dataset.id] = t.value;
  saveReview(f, review);
});

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form="load"]');
  if (!form) return;
  e.preventDefault();
  const msg = form.querySelector('.msg');
  const parsed = parseCode(form.elements.code.value);
  if (!parsed) { msg.textContent = 'That code doesn’t look right. It should look like 3-AB00C.'; return; }
  savePlan(parsed.f, parsed.plan);
  const target = '#/film/' + parsed.f.n + '/plan';
  if (location.hash === target) { rerender(); const m = document.querySelector('.loadform .msg'); if (m) m.textContent = 'Team plan loaded.'; }
  else location.hash = target;
});

document.addEventListener('keydown', e => {
  if (!$runner.hidden) {
    if (e.key === 'Escape') closeScriptRunner();
    else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stepScriptRunner(1); }
    else if (e.key === 'ArrowLeft') stepScriptRunner(-1);
    return;
  }
  if ($calls.hidden) return;
  if (e.key === 'Escape') closeCalls();
  else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stepCalls(1); }
  else if (e.key === 'ArrowLeft') stepCalls(-1);
});

route();
</script>
</body>
</html>
